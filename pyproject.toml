[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salescope"
version = "0.1.0"
description = "Retail sales prediction on BigMart with ML and hybrid stacks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
boost = ["lightgbm>=4.0", "catboost>=1.2"]
explain = ["shap>=0.44"]
forecast = ["statsmodels>=0.14"]
tune = ["optuna>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
salescope = "salescope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
